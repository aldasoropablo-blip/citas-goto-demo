<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel asesor Carvalho</title>
  <style>
    :root{--black:#090909;--gold:#ffcc00;--ink:#172033;--muted:#667085;--line:#dce2ea;--soft:#f6f7f8;--white:#fff;--green:#147a4f;--blue:#1d5fa7;--red:#a9362b;--amber:#9a6a12}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--soft)}a{color:var(--gold);font-weight:800}.header{background:var(--black);color:var(--white)}.header-inner,main{width:min(1180px,calc(100% - 32px));margin:0 auto}.header-inner{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:26px 0}h1,h2,h3,p{margin-top:0}h1{margin-bottom:6px;font-size:clamp(28px,4vw,42px)}.header p{margin-bottom:0;color:#e9e9e9}main{padding:26px 0 42px}.summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.summary-card,.toolbar,.table-card,.mobile-card{border:1px solid var(--line);border-radius:8px;background:var(--white);box-shadow:0 14px 36px rgba(9,9,9,.08)}.summary-card{padding:18px;border-top:4px solid var(--gold)}.summary-card span{display:block;color:var(--muted);font-size:13px;font-weight:800;text-transform:uppercase}.summary-card strong{display:block;margin-top:8px;color:var(--black);font-size:28px}.toolbar{display:flex;align-items:center;gap:12px;padding:16px;margin-bottom:18px}input,select,textarea,button{font:inherit;border-radius:6px}input,select,textarea{border:1px solid var(--line);padding:10px;color:var(--ink);background:#fff}.toolbar input{flex:1;min-width:220px}button{border:0;background:var(--black);color:#fff;padding:10px 12px;font-weight:800;cursor:pointer;white-space:nowrap}button.secondary{color:var(--ink);background:#e8eef3}button.danger{background:var(--red)}button.confirm{background:var(--green)}.table-card{overflow:auto;margin-bottom:26px}table{width:100%;border-collapse:collapse;background:#fff}th,td{border-bottom:1px solid var(--line);padding:12px;text-align:left;vertical-align:top}th{color:var(--black);background:#fafafa;font-size:13px;text-transform:uppercase}td input,td select,td textarea{width:100%;min-width:120px}td textarea{min-width:180px;min-height:72px;resize:vertical}.folio{color:var(--black);font-weight:800}.muted{color:var(--muted);line-height:1.5}.badge{display:inline-flex;align-items:center;min-height:26px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;background:#eef2f7;color:var(--muted)}.badge.confirmada{background:#e9f7f0;color:var(--green)}.badge.pendiente{background:#fff6df;color:var(--amber)}.badge.reagendada{background:#eaf2fc;color:var(--blue)}.badge.cancelada{background:#fdecec;color:var(--red)}.actions{display:grid;gap:8px;min-width:150px}.empty{color:var(--muted);text-align:center;padding:36px 12px}.cards-list{display:none}.section-title{margin:28px 0 12px}@media(max-width:980px){.header-inner,.toolbar{align-items:stretch;flex-direction:column}.summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.table-card{display:none}.cards-list{display:grid;gap:14px;margin-bottom:24px}.mobile-card{padding:16px}.mobile-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}.mobile-grid label{display:grid;gap:6px;color:var(--muted);font-weight:800}}@media(max-width:620px){.summary-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="header"><div class="header-inner"><div><h1>Panel asesor Carvalho</h1><p>Consulta y actualiza visitas inmobiliarias de Inmobiliaria Carvalho.</p></div><a href="/">Volver a la landing</a></div></header>
  <main>
    <section class="summary-grid" aria-label="Resumen de citas"><div class="summary-card"><span>Activas</span><strong id="activeCount">0</strong></div><div class="summary-card"><span>Confirmadas</span><strong id="confirmedCount">0</strong></div><div class="summary-card"><span>Reagendadas</span><strong id="rescheduledCount">0</strong></div><div class="summary-card"><span>Canceladas</span><strong id="cancelledCount">0</strong></div></section>
    <section class="toolbar"><input id="search" placeholder="Buscar cita por folio, nombre, telefono o correo"><button id="searchButton" type="button">Buscar</button><button id="clearButton" class="secondary" type="button">Limpiar</button></section>
    <h2 class="section-title">Citas activas</h2><section id="tableHost" class="table-card" aria-live="polite"></section><section id="cardsHost" class="cards-list" aria-live="polite"></section>
    <h2 class="section-title">Citas canceladas</h2><section id="cancelledTableHost" class="table-card" aria-live="polite"></section><section id="cancelledCardsHost" class="cards-list" aria-live="polite"></section>
  </main>
  <script>
    const tableHost=document.querySelector("#tableHost"),cardsHost=document.querySelector("#cardsHost"),cancelledTableHost=document.querySelector("#cancelledTableHost"),cancelledCardsHost=document.querySelector("#cancelledCardsHost"),search=document.querySelector("#search"),searchButton=document.querySelector("#searchButton"),clearButton=document.querySelector("#clearButton"),activeCount=document.querySelector("#activeCount"),confirmedCount=document.querySelector("#confirmedCount"),rescheduledCount=document.querySelector("#rescheduledCount"),cancelledCount=document.querySelector("#cancelledCount");
    searchButton.addEventListener("click",()=>loadCitas(search.value));clearButton.addEventListener("click",()=>{search.value="";loadCitas()});search.addEventListener("keydown",event=>{if(event.key==="Enter")loadCitas(search.value)});
    async function loadCitas(q=""){const params=q?`?q=${encodeURIComponent(q)}`:"";setLoading();try{const response=await fetch(`/api/citas${params}`);const citas=await response.json();renderSummary(citas);renderCitas(citas.filter(c=>c.estatus!=="Cancelada"),tableHost,cardsHost,"No hay citas activas para mostrar.");renderCitas(citas.filter(c=>c.estatus==="Cancelada"),cancelledTableHost,cancelledCardsHost,"No hay citas canceladas.")}catch(error){[tableHost,cardsHost,cancelledTableHost,cancelledCardsHost].forEach(host=>host.innerHTML=`<div class="empty">${escapeHtml(error.message)}</div>`)}}
    function setLoading(){tableHost.innerHTML='<div class="empty">Cargando citas...</div>';cardsHost.innerHTML=tableHost.innerHTML;cancelledTableHost.innerHTML='<div class="empty">Cargando canceladas...</div>';cancelledCardsHost.innerHTML=cancelledTableHost.innerHTML}
    function renderSummary(citas){const active=citas.filter(c=>c.estatus!=="Cancelada");activeCount.textContent=active.length;confirmedCount.textContent=citas.filter(c=>c.estatus==="Confirmada").length;rescheduledCount.textContent=citas.filter(c=>c.estatus==="Reagendada").length;cancelledCount.textContent=citas.filter(c=>c.estatus==="Cancelada").length}
    function renderCitas(citas,tableTarget,cardsTarget,emptyMessage){if(!citas.length){tableTarget.innerHTML=`<div class="empty">${emptyMessage}</div>`;cardsTarget.innerHTML=tableTarget.innerHTML;return}tableTarget.innerHTML=`<table><thead><tr><th>Folio</th><th>Cliente</th><th>Propiedad</th><th>Fecha y hora</th><th>Tipo</th><th>Estatus</th><th>Comentarios</th><th>Acciones</th></tr></thead><tbody>${citas.map(renderRow).join("")}</tbody></table>`;cardsTarget.innerHTML=citas.map(renderCard).join("")}
    function renderRow(cita){return `<tr data-folio="${escapeHtml(cita.folio)}"><td><span class="folio">${escapeHtml(cita.folio)}</span><br><span class="badge ${statusClass(cita.estatus)}">${escapeHtml(cita.estatus)}</span></td><td><strong>${escapeHtml(cita.nombre)}</strong><br><span class="muted">${escapeHtml(cita.telefono)}<br>${escapeHtml(cita.correo)}</span></td><td><strong>${escapeHtml(cita.propiedad||"Por confirmar")}</strong><br><span class="muted">${escapeHtml(cita.ubicacion||"")}</span></td><td><input name="fecha" type="date" value="${escapeHtml(cita.fecha)}"><br><br><input name="hora" type="time" value="${escapeHtml(cita.hora)}"></td><td><select name="tipo">${typeOptions(cita.tipo)}</select></td><td><select name="estatus">${statusOptions(cita.estatus)}</select></td><td><textarea name="comentarios">${escapeHtml(cita.comentarios||"")}</textarea></td><td>${actions(cita)}</td></tr>`}
    function renderCard(cita){return `<article class="mobile-card" data-folio="${escapeHtml(cita.folio)}"><div class="folio">${escapeHtml(cita.folio)}</div><strong>${escapeHtml(cita.nombre)}</strong><p class="muted">${escapeHtml(cita.telefono)} · ${escapeHtml(cita.correo)}</p><p><strong>${escapeHtml(cita.propiedad||"Por confirmar")}</strong><br><span class="muted">${escapeHtml(cita.ubicacion||"")}</span></p><span class="badge ${statusClass(cita.estatus)}">${escapeHtml(cita.estatus)}</span><div class="mobile-grid"><label>Fecha<input name="fecha" type="date" value="${escapeHtml(cita.fecha)}"></label><label>Hora<input name="hora" type="time" value="${escapeHtml(cita.hora)}"></label><label>Tipo<select name="tipo">${typeOptions(cita.tipo)}</select></label><label>Estatus<select name="estatus">${statusOptions(cita.estatus)}</select></label><label>Comentarios<textarea name="comentarios">${escapeHtml(cita.comentarios||"")}</textarea></label>${actions(cita)}</div></article>`}
    function actions(cita){if(cita.estatus==="Cancelada")return '<div class="muted">Visita cancelada</div>';return `<div class="actions"><button type="button" onclick="saveCita('${escapeJs(cita.folio)}')">Guardar cambios</button><button class="confirm" type="button" onclick="confirmCita('${escapeJs(cita.folio)}')">Confirmar asistencia</button><button class="danger" type="button" onclick="cancelCita('${escapeJs(cita.folio)}')">Cancelar visita</button></div>`}
    async function saveCita(folio){const container=document.querySelector(`[data-folio="${cssEscape(folio)}"]`);const payload=Object.fromEntries(new FormDataLike(container).entries());await fetch(`/api/citas/${encodeURIComponent(folio)}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});loadCitas(search.value)}
    async function confirmCita(folio){const container=document.querySelector(`[data-folio="${cssEscape(folio)}"]`);const payload=Object.fromEntries(new FormDataLike(container).entries());payload.estatus="Confirmada";await fetch(`/api/citas/${encodeURIComponent(folio)}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});loadCitas(search.value)}
    async function cancelCita(folio){tableHost.innerHTML='<div class="empty">Cancelando visita y actualizando agenda...</div>';cardsHost.innerHTML=tableHost.innerHTML;await fetch(`/api/citas/${encodeURIComponent(folio)}/cancelar`,{method:"PATCH"});loadCitas(search.value)}
    function FormDataLike(root){const fields=root.querySelectorAll("input,select,textarea");return{entries(){return Array.from(fields).map(field=>[field.name,field.value])}}}
    function typeOptions(selected){return["Visita a propiedad","Tour virtual","Asesoria hipotecaria","Firma de contrato","Consulta de renta","Consulta de venta"].map(value=>option(value,selected)).join("")}
    function statusOptions(selected){return["Pendiente","Confirmada","Reagendada","Cancelada"].map(value=>option(value,selected)).join("")}
    function option(value,selected){return `<option ${value===selected?"selected":""}>${escapeHtml(value)}</option>`}function statusClass(value){return String(value||"Pendiente").toLowerCase()}function cssEscape(value){return String(value).replaceAll('"','\\"')}function escapeJs(value){return String(value).replaceAll("'","\\'")}function escapeHtml(value){return String(value||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
    loadCitas();
  </script>
</body>
</html>
